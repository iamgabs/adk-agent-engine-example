[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
    "google-cloud-aiplatform[adk,agent_engines]>=1.88",
]

[tool.setuptools.packages.find]
where = ["agent_engine"]
include = ["agent*"]
